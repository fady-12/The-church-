```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منصة خدمة الكنيسة المتكاملة — حضور، إعلانات، دردشة، ١٠٠ سؤال ونقاط</title>

  <!-- خط Cairo العربي الحديث -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            church: {
              50: '#f4f7fb',
              100: '#e6edf7',
              500: '#1e40af',
              600: '#1e3a8a',
              700: '#172554',
              gold: '#b45309',
              goldLight: '#fef3c7',
            },
            wa: {
              bg: '#efeae2',
              darkBg: '#0b141a',
              out: '#d9fdd3',
              darkOut: '#005c4b',
              header: '#1e3a8a',
            }
          },
          boxShadow: {
            soft: '0 8px 30px -6px rgba(23, 37, 84, 0.08)',
            card: '0 4px 18px -2px rgba(23, 37, 84, 0.05)',
          }
        }
      }
    };
  </script>

  <style>
    /* تحسينات عامة وتمرير ناعم */
    body {
      font-family: 'Cairo', sans-serif;
      overflow-x: hidden;
    }

    /* خلفية دردشة بنمط واتساب مريحة للعين */
    .wa-chat-pattern {
      background-color: #f4f1ea;
      background-image: radial-gradient(rgba(30, 58, 138, 0.07) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .dark .wa-chat-pattern {
      background-color: #0b141a;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    /* تخصيص شريط التمرير */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.35);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.55);
    }

    /* حركة ناعمة للتنبيهات */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  <!-- نافذة تأكيد مخصصة داخل التطبيق (مع دعم تأكيد مزدوج أو كتابة كلمة تأكيد لعمليات إعادة الضبط) -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 animate-slide-up">
      <div class="flex items-center gap-2.5 mb-2">
        <span id="confirmIconBadge" class="w-9 h-9 rounded-xl bg-amber-100 dark:bg-amber-950/50 text-amber-800 dark:text-amber-300 flex items-center justify-center text-lg font-extrabold">⚠️</span>
        <h3 id="confirmTitle" class="text-lg font-extrabold text-slate-900 dark:text-white">تأكيد الإجراء</h3>
      </div>
      <p id="confirmMessage" class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-4 leading-relaxed"></p>

      <!-- حقل تأكيد كتابي اختياري للعمليات الحساسة (مثل إعادة ضبط المصنع) -->
      <div id="confirmChallengeBox" class="hidden mb-4 space-y-1.5 bg-rose-50/80 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-800/50 rounded-2xl p-3">
        <label id="confirmChallengeLabel" for="confirmChallengeInput" class="block text-xs font-extrabold text-rose-800 dark:text-rose-300"></label>
        <input id="confirmChallengeInput" type="text" autocomplete="off"
          class="w-full px-3 py-2 rounded-xl border border-rose-300 dark:border-rose-700 bg-white dark:bg-slate-900 text-xs sm:text-sm font-bold outline-none focus:ring-2 focus:ring-rose-500" />
      </div>

      <div class="flex items-center justify-end gap-2.5 pt-1">
        <button id="confirmCancelBtn" type="button" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
          إلغاء
        </button>
        <button id="confirmOkBtn" type="button" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-rose-600 hover:bg-rose-700 text-white transition shadow-sm">
          تأكيد
        </button>
      </div>
    </div>
  </div>

  <!-- نافذة دخول الخادم / القائد بكلمة سر مخفية -->
  <div id="servantLoginModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/65 backdrop-blur-xs p-4">
    <div class="bg-white dark:bg-slate-900 rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800 animate-slide-up">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-blue-100 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300 flex items-center justify-center text-xl font-bold">
            🛡️
          </div>
          <div>
            <h3 class="text-lg font-extrabold text-slate-900 dark:text-white">دخول القائد / الخادم</h3>
            <p class="text-xs text-slate-500 dark:text-slate-400">إدارة النقاط، الإعلانات، السحابة والغياب</p>
          </div>
        </div>
        <button onclick="closeServantModal()" class="w-9 h-9 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-500 hover:text-slate-800 dark:hover:text-white">
          ✕
        </button>
      </div>

      <p class="text-xs text-slate-600 dark:text-slate-300 bg-amber-50/90 dark:bg-amber-950/30 border border-amber-200/80 dark:border-amber-800/50 rounded-xl p-3 mb-4 leading-relaxed">
        المخدومون لا يحتاجون لأي رمز سحابي أو كلمة سر؛ يدخل المخدوم باسمه فقط. هذه النافذة مخصصة للقائد/الخادم بكلمة سر مخفية ومحمية.
      </p>

      <form id="servantLoginForm" class="space-y-4">
        <div>
          <label class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-200">اسم الخادم / القائد</label>
          <input id="servantNameInput" type="text" required placeholder="مثال: أ. مينا / خادم الشباب"
            class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-600 outline-none text-sm" />
        </div>
        <div>
          <label class="block text-sm font-bold mb-1.5 text-slate-700 dark:text-slate-200">كلمة السر السرية</label>
          <div class="relative flex items-center">
            <input id="servantPasscodeInput" type="password" required autocomplete="current-password" placeholder="أدخل كلمة سر الخادم"
              class="w-full pl-12 pr-4 py-3 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-blue-600 outline-none text-sm" />
            <button type="button" onclick="togglePasswordVisibility('servantPasscodeInput', this)" title="إظهار أو إخفاء كلمة السر أثناء الكتابة"
              class="absolute left-3 text-xs font-bold text-slate-500 hover:text-blue-700 dark:hover:text-blue-300 px-1.5 py-1 rounded-lg">
              👁️
            </button>
          </div>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-blue-800 hover:bg-blue-900 text-white font-bold text-sm shadow-lg shadow-blue-900/20 transition">
          تفعيل وضع الخادم
        </button>
      </form>
    </div>
  </div>

  <!-- الشريط العلوي الرئيسي -->
  <header class="sticky top-0 z-30 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- الشعار والعنوان -->
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-blue-800 via-blue-900 to-amber-700 text-white flex items-center justify-center text-xl shadow-md">
          ✝️
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-base sm:text-lg font-extrabold tracking-tight text-slate-900 dark:text-white">
              منصة خدمة الكنيسة
            </h1>
            <span id="roleBadge" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-900/50 dark:text-emerald-300">
              وضع المخدوم
            </span>
          </div>
          <p id="activeMemberBanner" class="text-xs text-slate-500 dark:text-slate-400">
            مرحباً بك — ادخل باسمك فقط لتظهر فوراً للخادم
          </p>
        </div>
      </div>

      <!-- حالة المزامنة وأزرار التحكم السريعة -->
      <div class="flex items-center gap-2">
        <div id="cloudStatusPill" class="hidden sm:flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/70 dark:border-slate-700">
          <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-amber-500"></span>
          <span id="cloudStatusText">تخزين محلي جاهز</span>
        </div>

        <button id="syncNowBtn" onclick="syncWithGitHub('push')" title="مزامنة الآن مع GitHub"
          class="px-3 py-2 rounded-xl text-xs font-bold bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/50 dark:hover:bg-blue-900/60 text-blue-800 dark:text-blue-300 border border-blue-200/70 dark:border-blue-800/50 transition flex items-center gap-1.5">
          <span>☁️</span>
          <span class="hidden md:inline">مزامنة</span>
        </button>

        <button onclick="toggleDarkMode()" title="تبديل الوضع الليلي/النهاري"
          class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 flex items-center justify-center text-base transition">
          <span id="themeIcon">🌙</span>
        </button>

        <button id="servantToggleBtn" onclick="handleServantButtonClick()"
          class="px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-900 hover:bg-blue-800 dark:bg-blue-700 dark:hover:bg-blue-600 text-white transition flex items-center gap-1.5 shadow-xs">
          <span>🛡️</span>
          <span id="servantBtnLabel">دخول الخادم</span>
        </button>
      </div>
    </div>

    <!-- شريط آية اليوم والتأمل اليومي المتجدد -->
    <div class="bg-gradient-to-l from-blue-950 via-blue-900 to-slate-900 text-amber-50 border-t border-blue-800/60">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 text-xs">
        <div class="flex items-start sm:items-center gap-2">
          <span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 font-extrabold shrink-0">📖 آية اليوم</span>
          <span id="dailyVerseText" class="font-bold leading-relaxed"></span>
        </div>
        <span id="dailyVerseRef" class="text-amber-300 font-extrabold shrink-0"></span>
      </div>
    </div>

    <!-- بطاقة تسجيل اسم المخدوم السريعة (بدون أي رمز سحابي) -->
    <div class="bg-blue-50/70 dark:bg-slate-900/70 border-t border-blue-100 dark:border-slate-800">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5">
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span class="font-bold text-blue-900 dark:text-blue-300">👤 اسم المخدوم النشط:</span>
          <span id="currentUserNameDisplay" class="font-extrabold px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800 text-slate-900 dark:text-white border border-blue-200 dark:border-slate-700">
            لم يُدخل الاسم بعد
          </span>
          <span class="text-slate-500 dark:text-slate-400">
            (اكتب اسمك فقط وسيظهر فوراً للخادم في الحضور، الدردشة، والأسئلة بدون أي رمز سحابي)
          </span>
        </div>

        <form id="quickMemberForm" class="flex items-center gap-2 w-full sm:w-auto">
          <input id="memberNameInput" list="knownMembersList" type="text" placeholder="اكتب اسمك الكامل هنا..."
            class="flex-1 sm:w-56 px-3.5 py-2 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 focus:ring-2 focus:ring-blue-600 outline-none font-semibold" />
          <datalist id="knownMembersList"></datalist>
          <button type="submit" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-800 hover:bg-blue-900 text-white transition whitespace-nowrap">
            دخول باسمي
          </button>
        </form>
      </div>
    </div>

    <!-- شريط التنقل العلوي لأجهزة الكمبيوتر والتابلت -->
    <nav class="hidden md:block bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800/80">
      <div class="max-w-7xl mx-auto px-6 flex items-center gap-1">
        <button data-tab="attendance" class="nav-tab px-4 py-3 text-sm font-bold border-b-2 border-blue-800 text-blue-900 dark:text-blue-300 transition flex items-center gap-2">
          <span>📋</span><span>الحضور والغياب</span>
        </button>
        <button data-tab="chat" class="nav-tab px-4 py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition flex items-center gap-2">
          <span>💬</span><span>دردشة وتساب</span>
          <span id="desktopUnreadBadge" class="hidden px-2 py-0.5 text-[11px] rounded-full bg-emerald-600 text-white font-extrabold">0</span>
        </button>
        <button data-tab="quiz" class="nav-tab px-4 py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition flex items-center gap-2">
          <span>🧠</span><span>١٠٠ سؤال يومياً</span>
        </button>
        <button data-tab="leaderboard" class="nav-tab px-4 py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition flex items-center gap-2">
          <span>🏆</span><span>النقاط ولوحة الشرف</span>
        </button>
        <button data-tab="servant" class="nav-tab px-4 py-3 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition flex items-center gap-2">
          <span>⚙️</span><span>تحكم القائد والسحابة</span>
        </button>
      </div>
    </nav>
  </header>

  <!-- المحتوى الرئيسي للتطبيق -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 pb-24 md:pb-8 space-y-5">

    <!-- قسم إعلانات وتنبيهات الخدمة والتأمل اليومي -->
    <section class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white dark:bg-slate-900 rounded-3xl p-4 sm:p-5 shadow-card border border-amber-200/80 dark:border-amber-900/40">
        <div class="flex items-center justify-between gap-2 mb-3">
          <div class="flex items-center gap-2">
            <span class="w-8 h-8 rounded-xl bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 flex items-center justify-center text-base">📢</span>
            <div>
              <h2 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">إعلانات وتنبيهات الخدمة</h2>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">مواعيد الاجتماعات، المناسبات والرحلات الكنسية</p>
            </div>
          </div>
          <span id="announcementsCountBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200/70 dark:border-amber-800/40">0 إعلان</span>
        </div>
        <div id="announcementsListContainer" class="space-y-2 max-h-40 overflow-y-auto pr-0.5"></div>
      </div>

      <div class="bg-gradient-to-br from-blue-900 to-slate-900 text-white rounded-3xl p-4 sm:p-5 shadow-card flex flex-col justify-between">
        <div>
          <div class="inline-flex items-center gap-1.5 text-[11px] font-bold px-2.5 py-1 rounded-full bg-white/15 text-amber-300 mb-2">
            <span>✨</span>
            <span>تأمل اليوم الروحي</span>
          </div>
          <p id="dailyReflectionText" class="text-xs sm:text-sm leading-relaxed text-blue-50 font-semibold"></p>
        </div>
        <div class="mt-3 pt-2.5 border-t border-white/15 flex items-center justify-between text-[11px] text-amber-200 font-bold">
          <span>الخدمة بالمحبة والافتقاد</span>
          <span id="dailyReflectionDate"></span>
        </div>
      </div>
    </section>

    <!-- ================= 1. تبويب الحضور والغياب ================= -->
    <section id="tab-attendance" class="tab-panel space-y-5">
      <!-- بطاقات الإحصاء -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-card border border-slate-200/70 dark:border-slate-800">
          <div class="text-xs font-bold text-slate-500 dark:text-slate-400">إجمالي المخدومين</div>
          <div id="statTotalMembers" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">0</div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-card border border-emerald-200/70 dark:border-emerald-900/50">
          <div class="text-xs font-bold text-emerald-600 dark:text-emerald-400">عدد الحضور اليوم</div>
          <div id="statPresentCount" class="text-2xl sm:text-3xl font-extrabold text-emerald-600 dark:text-emerald-400 mt-1">0</div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-card border border-rose-200/70 dark:border-rose-900/50">
          <div class="text-xs font-bold text-rose-600 dark:text-rose-400">عدد الغياب</div>
          <div id="statAbsentCount" class="text-2xl sm:text-3xl font-extrabold text-rose-600 dark:text-rose-400 mt-1">0</div>
        </div>
        <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 shadow-card border border-violet-200/70 dark:border-violet-900/50">
          <div class="text-xs font-bold text-violet-600 dark:text-violet-400">نسبة الحضور</div>
          <div id="statAttendanceRate" class="text-2xl sm:text-3xl font-extrabold text-violet-600 dark:text-violet-400 mt-1">0%</div>
        </div>
      </div>

      <!-- شريط التاريخ والاجتماع + تسجيل حضور سريع للمخدوم -->
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
        <!-- تسجيل حضور سريع للمخدوم أو إضافة اسم جديد -->
        <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-soft border border-slate-200/70 dark:border-slate-800 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white">تسجيل حضور سريع</h2>
            <span class="text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300 font-bold">
              يظهر للخادم فوراً
            </span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            اكتب اسمك أو اختره وسيتم تسجيل حضورك في الاجتماع المحدد ومنحك نقاط الحضور تلقائياً وإظهار اسمك في قائمة الخادم.
          </p>

          <form id="selfCheckInForm" class="space-y-3">
            <div>
              <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">اسم المخدوم</label>
              <input id="checkInNameInput" type="text" required placeholder="مثال: مريم جرجس"
                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:ring-2 focus:ring-emerald-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold mb-1 text-slate-600 dark:text-slate-300">حالة التسجيل</label>
              <select id="checkInStatusSelect" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm font-semibold outline-none">
                <option value="present">حاضر ✅</option>
                <option value="excused">مستأذن / بعذر 📝</option>
                <option value="absent">غائب ❌</option>
              </select>
            </div>

    // حساب تجزئة SHA-256 لكلمة السر حتى لا تُخزن أو تُعرض كنص واضح
    async function hashSecretSHA256(plainText) {
      const clean = String(plainText || '').trim();
      if (window.crypto && window.crypto.subtle) {
        const encoder = new TextEncoder();
        const data = encoder.encode(`church_salt_v2::${clean}`);
        const digest = await window.crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(digest))
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
      }
      // بديل توافقي احتياطي في حال غياب SubtleCrypto
      let h = 2166136261;
      const salted = `church_salt_v2::${clean}`;
      for (let i = 0; i < salted.length; i++) {
        h ^= salted.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return `fb_${(h >>> 0).toString(16)}`;
    }

    function openConfirmModal(title, message, onConfirm, options = {}) {
      const modal = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmMessage').textContent = message;

      const iconBadge = document.getElementById('confirmIconBadge');
      iconBadge.textContent = options.icon || '⚠️';

      const challengeLabel = document.getElementById('confirmChallengeLabel');
      const challengeInput = document.getElementById('confirmChallengeInput');
      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');

      okBtn.textContent = options.okText || 'تأكيد';
      cancelBtn.textContent = options.cancelText || 'إلغاء';

      const requiresPhrase = Boolean(options.requiredPhrase);
      if (requiresPhrase) {
        challengeBox.classList.remove('hidden');
        challengeLabel.textContent = `للتأكيد النهائي ومنع المسح بالخطأ، اكتب الكلمة: "${options.requiredPhrase}"`;

      } else {
        challengeBox.classList.add('hidden');
        challengeInput.value = '';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      if (requiresPhrase) {
        setTimeout(() => challengeInput.focus(), 40);
      }

      const cleanup = () => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        challengeBox.classList.add('hidden');
        challengeInput.value = '';
        okBtn.onclick = null;
        cancelBtn.onclick = null;
      };

      cancelBtn.onclick = () => cleanup();
      okBtn.onclick = () => {
        if (requiresPhrase && challengeInput.value.trim() !== options.requiredPhrase) {
          showToast(`يجب كتابة كلمة "${options.requiredPhrase}" بدقة للتأكيد النهائي`, 'warning');
          challengeInput.focus();
          return;
        }
        cleanup();
        if (typeof onConfirm === 'function') {
          onConfirm();
        }
      };

    function ensureServantAuthorizedForReset() {
      if (!appState.currentUser.isServantAuthenticated) {
        showToast('عمليات إعادة الضبط متاحة للقائد / الخادم فقط بعد تسجيل الدخول', 'warning');
        openServantModal();
        return false;
      }
      return true;
    }

    function buildBackupSnapshotPayload() {
      return {
        exportedAt: new Date().toISOString(),
        date: getTodayISO(),
        pointSettings: { ...appState.pointSettings },
        members: JSON.parse(JSON.stringify(appState.members || [])),
        attendance: JSON.parse(JSON.stringify(appState.attendance || {})),
        quizProgress: JSON.parse(JSON.stringify(appState.quizProgress || {})),
        messages: JSON.parse(JSON.stringify(appState.messages || [])),
        announcements: JSON.parse(JSON.stringify(appState.announcements || [])),
      };
    }

    function downloadJsonBackupSnapshot(customPrefix = 'church-backup') {
      try {
        const snapshot = buildBackupSnapshotPayload();
        const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${customPrefix}-${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('تم حفظ نسخة احتياطية (JSON) بنجاح', 'success');
      } catch (err) {
        console.error('فشل حفظ النسخة الاحتياطية:', err);
        showToast('تعذر حفظ النسخة الاحتياطية محلياً', 'error');
      }
    }

        : `سيتم مسح سجل الحضور والغياب ليوم (${dateKey}) فقط، مع الإبقاء على أسماء المخدومين ونقاطهم.`;

    }

    // 3. إعادة ضبط النقاط ولوحة الشرف فقط (مع خيار حفظ نسخة احتياطية وإبقاء الحضور والأسئلة)
    function requestResetPointsOnly() {
      if (!ensureServantAuthorizedForReset()) return;
      const saveBackup = Boolean(document.getElementById('backupBeforePointsResetCheckbox')?.checked);

      openConfirmModal(
        'إعادة ضبط النقاط ولوحة الشرف فقط',

        () => {
          openConfirmModal(
            'تأكيد نهائي — تصفير النقاط ولوحة الشرف',
            'تأكيد نهائي: هل تريد تصفير جميع النقاط وتحديث لوحة الشرف الآن؟',
            () => {
              if (saveBackup) {
                downloadJsonBackupSnapshot('church-points-backup');
              }

              // تصفير نقاط التعديل الإضافية للأعضاء
              appState.members = (appState.members || []).map(m => ({
                ...m,
                bonusPoints: 0,
              }));

              // تصفير النقاط المكتسبة من سجلات الأسئلة مع الاحتفاظ بسجل المحاولات نفسها
              Object.keys(appState.quizProgress || {}).forEach(dateKey => {
                const dayMap = appState.quizProgress[dateKey] || {};
                Object.keys(dayMap).forEach(userKey => {

                    dayMap[userKey].bonusAwarded = false;
                    dayMap[userKey].submittedPoints = 0;

              // استبعاد نقاط الحضور التلقائية القديمة عبر حفظ نقطة بداية للتصفير
              appState.pointSettings.pointsPerAttendance = 0;

      const resetPasswordToo = Boolean(document.getElementById('factoryResetPasswordCheckbox')?.checked);

      openConfirmModal(

              freshState.currentUser.servantName = appState.currentUser.servantName || 'خادم الخدمة';

              appState = freshState;
              currentQuestionIndex = 0;
              manualDailySalt = 0;
              clearReplyTarget();
              saveLocalState(false);
              renderAll();
              showToast(

                  : 'تمت إعادة ضبط المصنع الكاملة بنجاح مع الإبقاء على كلمة السر الحالية',

              );

            }
          );

        { icon: '🏭', okText: 'متابعة التحذير' }
      );

    function escapeHTML(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    /* =========================================================================
       3. الوضع الليلي والتنقل بين التبويبات ودخول الخادم
       ========================================================================= */
    function initTheme() {
      const savedTheme = localStorage.getItem(THEME_KEY);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = savedTheme ? savedTheme === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', isDark);
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').textContent = isDark ? '☀️' : '🌙';
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('hidden', panel.id !== `tab-${tabName}`);
      });

      document.querySelectorAll('.nav-tab').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.className = isActive
          ? 'nav-tab px-4 py-3 text-sm font-bold border-b-2 border-blue-800 text-blue-900 dark:text-blue-300 transition flex items-center gap-2'

      });

      document.querySelectorAll('.mobile-nav-btn').forEach(btn => {
        const isActive = btn.dataset.tab === tabName;
        btn.className = isActive
          ? 'mobile-nav-btn relative flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-bold text-blue-900 dark:text-blue-300 bg-blue-50 dark:bg-blue-950/50'
          : 'mobile-nav-btn relative flex flex-col items-center justify-center py-1 rounded-xl text-[10px] font-bold text-slate-500 dark:text-slate-400';

        appState.lastReadMessageCount = appState.messages.length;
        saveLocalState(false);

    function openServantModal() {
      document.getElementById('servantNameInput').value = appState.currentUser.servantName || '';
      const passInp = document.getElementById('servantPasscodeInput');
      passInp.value = '';
      passInp.type = 'password';

    document.getElementById('servantLoginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      await ensureDefaultSecretInitialized();
      const sName = document.getElementById('servantNameInput').value.trim() || 'خادم الخدمة';
      const pass = document.getElementById('servantPasscodeInput').value.trim();
      const enteredHash = await hashSecretSHA256(pass);

      if (enteredHash === appState.servantSecretHash) {
        appState.currentUser.servantName = sName;
        appState.currentUser.isServantAuthenticated = true;
        appState.currentUser.role = 'servant';
        saveLocalState(false);
        closeServantModal();
        showToast(`مرحباً بك يا ${sName} — تم تفعيل صلاحيات القائد/الخادم`, 'success');
        renderAll();
      } else {
        showToast('كلمة السر غير صحيحة!', 'error');
      }
    });

    // تغيير كلمة السر المخفية والتحقق من الحالية وتأكيد الجديدة
    document.getElementById('changePasswordForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      if (!appState.currentUser.isServantAuthenticated) {
        showToast('يجب الدخول كقائد/خادم أولاً', 'warning');
        return;
      }
      await ensureDefaultSecretInitialized();

      const currentVal = document.getElementById('currentSecretInput').value.trim();
      const newVal = document.getElementById('newSecretInput').value.trim();
      const confirmVal = document.getElementById('confirmSecretInput').value.trim();

      const currentHash = await hashSecretSHA256(currentVal);
      if (currentHash !== appState.servantSecretHash) {
        showToast('كلمة السر الحالية غير صحيحة!', 'error');
        return;
      }

      if (newVal.length < 4) {
        showToast('كلمة السر الجديدة يجب أن تكون 4 أحرف أو أرقام على الأقل', 'warning');
        return;
      }

      if (newVal !== confirmVal) {
        showToast('كلمة السر الجديدة وتأكيدها غير متطابقين!', 'error');
        return;
      }

      appState.servantSecretHash = await hashSecretSHA256(newVal);
      document.getElementById('currentSecretInput').value = '';
      document.getElementById('newSecretInput').value = '';
      document.getElementById('confirmSecretInput').value = '';
      saveLocalState();
      showToast('تم تحديث كلمة سر القائد وتشفيرها بنجاح!', 'success');
    });

    async function resetSecretWithCloudRecovery() {
      if (!appState.currentUser.isServantAuthenticated) return;
      openConfirmModal(
        'إعادة تعيين كلمة السر عبر إعدادات السحابة',
        'سيتم إعادة ضبط كلمة السر إلى القيمة الافتراضية ثم يمكنك تغييرها فوراً من نموذج التغيير. هل تريد المتابعة؟',
        async () => {
          appState.servantSecretHash = await hashSecretSHA256(DEFAULT_SERVANT_SECRET);
          saveLocalState();
          showToast('تمت إعادة تعيين كلمة السر الافتراضية — يُنصح بتغييرها فوراً', 'warning');
        }
      );
    }

    /* =========================================================================
       4. تسجيل اسم المخدوم السريع وظهوره للخادم
       ========================================================================= */
    function ensureMemberExists(name, note = '') {
      const cleanName = name.trim();
      if (!cleanName) return null;

      let existing = appState.members.find(m => m.name.trim() === cleanName);
      if (!existing) {
        existing = {
          id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          name: cleanName,
          bonusPoints: 0,
          note: note || 'انضم عبر إدخال الاسم مباشرة',
        };
        appState.members.push(existing);
        recordActivity(cleanName, 'دخل التطبيق باسمه وأصبح ظاهراً للخادم', 0);
      }
      return existing;
    }

    function recordActivity(memberName, action, pointsChange = 0) {
      const today = getTodayISO();
      appState.activityLog.unshift({
        id: 'act_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        memberName: memberName || 'مخدوم',
        action,
        pointsChange,
        time: formatTimeNow(),
        date: today,
      });
      if (appState.activityLog.length > 100) {
        appState.activityLog = appState.activityLog.slice(0, 100);
      }
    }

    function setActiveMemberName(name) {
      const clean = name.trim();
      if (!clean) {
        showToast('من فضلك اكتب اسمك أولاً', 'warning');
        return;
      }
      ensureMemberExists(clean);
      appState.currentUser.name = clean;
      appState.currentUser.role = 'served';
      appState.currentUser.isServantAuthenticated = false;
      saveLocalState();
      showToast(`أهلاً بك يا ${clean}! اسمك مسجل الآن ويظهر للخادم`, 'success');
      renderAll();
    }

    function getSelectedAttendanceDate() {
      const inp = document.getElementById('attendanceDateInput');
      if (!inp.value) inp.value = getTodayISO();
      return inp.value;
    }

    function setAttendanceFilter(filter) {
      attendanceFilter = filter;
      document.querySelectorAll('.att-filter-btn').forEach(btn => {
        const active = btn.dataset.attFilter === filter;
        btn.className = active
          ? 'att-filter-btn px-3 py-1.5 rounded-lg font-bold bg-blue-800 text-white'

      });
      renderAttendanceSection();
    }

    function getMemberAttendancePercentage(memberId) {
      const dates = Object.keys(appState.attendance || {});
      if (!dates.length) return 0;
      let attended = 0;
      dates.forEach(d => {
        const st = appState.attendance[d]?.[memberId]?.status;
        if (st === 'present' || st === 'excused') attended++;
      });
      return Math.round((attended / dates.length) * 100);
    }

    function exportAttendanceAndPointsCSV() {
      const dateKey = getSelectedAttendanceDate();
      const dayRecords = appState.attendance[dateKey] || {};
      const rows = [
        ['الاسم', 'حالة اليوم', 'ملاحظة اليوم', 'نسبة الالتزام الكلية %', 'إجمالي النقاط']
      ];

      appState.members.forEach(m => {
        const st = dayRecords[m.id]?.status || 'absent';
        const stAr = st === 'present' ? 'حاضر' : st === 'excused' ? 'مستأذن' : 'غائب';
        const note = (dayRecords[m.id]?.note || '').replace(/,/g, ' ');
        const pct = getMemberAttendancePercentage(m.id);
        const pts = calculateMemberPointsBreakdown(m).totalPoints;
        rows.push([m.name, stAr, note, `${pct}%`, pts]);
      });

      const csvContent = '\uFEFF' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `church-attendance-points-${dateKey}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('تم تصدير تقرير الحضور والنقاط (CSV)', 'success');
    }

    function copyAttendanceTextReport() {
      const dateKey = getSelectedAttendanceDate();
      const sessionTitle = appState.sessionLabels[dateKey] || 'اجتماع الخدمة';
      const dayRecords = appState.attendance[dateKey] || {};

      const presentNames = [];
      const absentNames = [];
      const excusedNames = [];

      appState.members.forEach(m => {
        const st = dayRecords[m.id]?.status || 'absent';
        if (st === 'present') presentNames.push(m.name);
        else if (st === 'excused') excusedNames.push(`${m.name}${dayRecords[m.id]?.note ? ` (${dayRecords[m.id].note})` : ''}`);
        else absentNames.push(m.name);
      });

      const report = [
        `✝️ تقرير حضور الخدمة — ${sessionTitle} (${dateKey})`,
        `✅ الحضور (${presentNames.length}): ${presentNames.join('، ') || 'لا يوجد'}`,
        `📝 المستأذنون (${excusedNames.length}): ${excusedNames.join('، ') || 'لا يوجد'}`,
        `❌ الغياب (${absentNames.length}): ${absentNames.join('، ') || 'لا يوجد'}`,
      ].join('\n');

      const ta = document.createElement('textarea');
      ta.value = report;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('تم نسخ التقرير النصي للحضور والغياب', 'success');
      } catch (err) {
        showToast('تعذر النسخ التلقائي', 'warning');
      }
      document.body.removeChild(ta);
    }

    document.getElementById('selfCheckInForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const nameVal = document.getElementById('checkInNameInput').value.trim();
      const statusVal = document.getElementById('checkInStatusSelect').value;
      const noteVal = document.getElementById('checkInNoteInput').value.trim();

      if (!nameVal) {
        showToast('اكتب اسمك لتسجيل الحضور', 'warning');
        return;
      }

      const member = ensureMemberExists(nameVal, noteVal);
      appState.currentUser.name = member.name;

      const dateKey = getSelectedAttendanceDate();
      if (!appState.attendance[dateKey]) appState.attendance[dateKey] = {};

      appState.attendance[dateKey][member.id] = {
        status: statusVal,
        note: noteVal,
        time: formatTimeNow(),
      };

      const statusArabic = statusVal === 'present' ? 'حاضر ✅' : statusVal === 'excused' ? 'مستأذن 📝' : 'غائب ❌';
      const pts = statusVal === 'present'
        ? appState.pointSettings.pointsPerAttendance
        : statusVal === 'excused'
          ? appState.pointSettings.pointsPerExcused
          : 0;

      recordActivity(member.name, `سجل (${statusArabic}) في ${dateKey}`, pts);
      document.getElementById('checkInNoteInput').value = '';
      saveLocalState();
      showToast(`تم تسجيل ${member.name} كـ (${statusArabic}) وظهر للخادم`, 'success');
      renderAll();
    });

    function updateMemberAttendanceStatus(memberId, newStatus) {
      const dateKey = getSelectedAttendanceDate();
      if (!appState.attendance[dateKey]) appState.attendance[dateKey] = {};
      const prev = appState.attendance[dateKey][memberId] || { note: '', time: formatTimeNow() };
      appState.attendance[dateKey][memberId] = {
        ...prev,
        status: newStatus,
        time: formatTimeNow(),
      };

      const member = appState.members.find(m => m.id === memberId);
      if (member) {
        const label = newStatus === 'present' ? 'حاضر' : newStatus === 'excused' ? 'مستأذن' : 'غائب';
        recordActivity(member.name, `تحديث الحالة إلى (${label}) بتاريخ ${dateKey}`, 0);
      }

      saveLocalState();
      renderAll();
    }

    function deleteMemberRecord(memberId) {
      if (!appState.currentUser.isServantAuthenticated) {
        showToast('حذف عضو متاح للخادم فقط', 'warning');
        return;
      }
      const member = appState.members.find(m => m.id === memberId);
      if (!member) return;

      openConfirmModal('حذف مخدوم', `هل تريد حذف "${member.name}" من القائمة؟`, () => {
        appState.members = appState.members.filter(m => m.id !== memberId);
        Object.keys(appState.attendance).forEach(d => {
          if (appState.attendance[d]) delete appState.attendance[d][memberId];
        });
        saveLocalState();
        showToast(`تم حذف ${member.name}`, 'info');
        renderAll();
      });
    }

    function renderAttendanceSection() {
      const dateKey = getSelectedAttendanceDate();
      const sessionInput = document.getElementById('sessionLabelInput');
      if (!appState.sessionLabels[dateKey]) {
        appState.sessionLabels[dateKey] = 'اجتماع الخدمة الأسبوعي';
      }
      if (document.activeElement !== sessionInput) {
        sessionInput.value = appState.sessionLabels[dateKey];
      }

      const dayRecords = appState.attendance[dateKey] || {};
      const totalMembers = appState.members.length;

      let presentCount = 0;
      let absentCount = 0;
      let excusedCount = 0;

      appState.members.forEach(m => {
        const st = dayRecords[m.id]?.status || 'absent';
        if (st === 'present') presentCount++;
        else if (st === 'excused') excusedCount++;
        else absentCount++;
      });

      const rate = totalMembers > 0 ? Math.round((presentCount / totalMembers) * 100) : 0;

      document.getElementById('statTotalMembers').textContent = totalMembers;
      document.getElementById('statPresentCount').textContent = presentCount;
      document.getElementById('statAbsentCount').textContent = absentCount;
      document.getElementById('statAttendanceRate').textContent = `${rate}%`;

      const searchTerm = (document.getElementById('attendanceSearchInput').value || '').trim().toLowerCase();
      const container = document.getElementById('attendanceListContainer');

      const filtered = appState.members.filter(m => {
        const st = dayRecords[m.id]?.status || 'absent';
        const matchesSearch = !searchTerm || m.name.toLowerCase().includes(searchTerm);
        const matchesFilter = attendanceFilter === 'all' || st === attendanceFilter;
        return matchesSearch && matchesFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-sm text-slate-400">
            لا توجد أسماء مطابقة للتصفية الحالية. يمكنك تسجيل اسم جديد من البطاقة المجاورة.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(m => {
        const rec = dayRecords[m.id] || { status: 'absent', note: '', time: '—' };
        const pct = getMemberAttendancePercentage(m.id);
        const statusBadgeMap = {
          present: '<span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">حاضر ✅</span>',
          excused: '<span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300">مستأذن 📝</span>',
          absent: '<span class="px-2.5 py-1 rounded-full text-xs font-extrabold bg-rose-100 text-rose-700 dark:bg-rose-900/40 dark:text-rose-300">غائب ❌</span>',
        };

        return `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2.5 p-3 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200/60 dark:border-slate-700/60">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-extrabold text-sm text-slate-900 dark:text-white">${escapeHTML(m.name)}</span>
                ${statusBadgeMap[rec.status] || statusBadgeMap.absent}
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-blue-100/80 dark:bg-blue-950/60 text-blue-800 dark:text-blue-300">التزام ${pct}%</span>
                <span class="text-[11px] text-slate-400">🕒 ${escapeHTML(rec.time || '—')}</span>
              </div>
              ${rec.note ? `<p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">ملاحظة: ${escapeHTML(rec.note)}</p>` : ''}
            </div>

            <div class="flex items-center gap-1.5 shrink-0">
              <button onclick="updateMemberAttendanceStatus('${m.id}', 'present')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${rec.status === 'present' ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-900 text-emerald-700 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800'}">حاضر</button>
              <button onclick="updateMemberAttendanceStatus('${m.id}', 'excused')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${rec.status === 'excused' ? 'bg-amber-500 text-slate-950' : 'bg-white dark:bg-slate-900 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-800'}">مستأذن</button>
              <button onclick="updateMemberAttendanceStatus('${m.id}', 'absent')" class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${rec.status === 'absent' ? 'bg-rose-600 text-white' : 'bg-white dark:bg-slate-900 text-rose-700 dark:text-rose-400 border border-rose-200 dark:border-rose-800'}">غائب</button>
              ${appState.currentUser.isServantAuthenticated ? `<button onclick="deleteMemberRecord('${m.id}')" title="حذف" class="px-2 py-1.5 rounded-xl text-xs font-bold bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-rose-600 hover:text-white transition">🗑️</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

      const inp = document.getElementById('chatMessageInput');
      const text = inp.value.trim();
      if (!text) return;

      let senderName = '';
      let senderRole = 'served';

      if (appState.currentUser.isServantAuthenticated) {
        senderName = `${appState.currentUser.servantName || 'خادم'} (خادم)`;
        senderRole = 'servant';
      } else {
        if (!appState.currentUser.name) {
          showToast('من فضلك اكتب اسمك في شريط "اسم المخدوم النشط" بالأعلى أولاً', 'warning');
          document.getElementById('memberNameInput').focus();
          return;
        }
        senderName = appState.currentUser.name;
        ensureMemberExists(senderName);
      }

      let replySnapshot = null;
      if (appState.replyToMessageId) {
        const foundReply = appState.messages.find(m => m.id === appState.replyToMessageId);
        if (foundReply) {
          replySnapshot = {
            sender: foundReply.sender,
            text: foundReply.text.slice(0, 70),
          };
        }
      }

      appState.messages.push({
        id: 'msg_' + Date.now(),
        sender: senderName,
        senderRole,
        text,
        time: formatTimeNow(),
        date: getTodayISO(),
        replyTo: replySnapshot,
      });

      if (appState.messages.length > 250) {
        appState.messages = appState.messages.slice(-250);
      }

      appState.lastReadMessageCount = appState.messages.length;
      clearReplyTarget();
      recordActivity(senderName, `أرسل رسالة في دردشة وتساب: "${text.slice(0, 35)}"`, 0);
      inp.value = '';
      saveLocalState();
      renderChatSection();
      scrollChatToBottom();
    });

    function seededRandom(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function getDaySeed(dateStr = getTodayISO()) {
      let hash = 0;
      const combined = `${dateStr}__daily100_v3__salt_${manualDailySalt}`;
      for (let i = 0; i < combined.length; i++) {
        hash = ((hash << 5) - hash) + combined.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) + 313;
    }

      'العهد القديم',
      'العهد الجديد',

    function generate100DailyQuestions(dateStr = getTodayISO()) {
      const rand = seededRandom(getDaySeed(dateStr));
      const questions = [];

      // توليد 100 سؤال مختلف تماماً ومتنوع عبر المحاور الخمسة لكل تاريخ يومي
      for (let i = 0; i < 100; i++) {
        const axis = QUIZ_AXES_ORDER[i % QUIZ_AXES_ORDER.length];
        const bank = DAILY_QUESTION_BANKS[axis];
        const randPick = Math.floor(rand() * bank.length);
        const tpl = bank[(i + randPick) % bank.length];

        // خلط الخيارات عشوائياً وفق بذرة اليوم لتغيير مواقع الإجابات كل يوم
        const indexedOpts = tpl.opts.map((optText, idx) => ({
          text: optText,
          isCorrect: idx === tpl.ans,
        }));

        for (let j = indexedOpts.length - 1; j > 0; j--) {
          const k = Math.floor(rand() * (j + 1));
          [indexedOpts[j], indexedOpts[k]] = [indexedOpts[k], indexedOpts[j]];
        }

        const correctIndex = indexedOpts.findIndex(item => item.isCorrect);
        const seedStamp = ((getDaySeed(dateStr) + (i + 1) * 37) % 899) + 101;
        const promptPrefix = `سؤال ${i + 1} من 100`;

        questions.push({
          number: i + 1,
          id: `${dateStr}-${axis}-q${i + 1}-${seedStamp}`,
          category: axis,
          questionText: `${tpl.q} (كود يومي #${seedStamp})`,
          badgeNumberText: promptPrefix,
          options: indexedOpts.map(o => o.text),
          correctIndex,
          explanation: tpl.exp,
        });
      }

      return questions;
    }

    function getCurrentQuizMemberKey() {
      if (appState.currentUser.isServantAuthenticated) {
        return `${appState.currentUser.servantName || 'خادم'} (خادم)`;
      }
      return appState.currentUser.name || 'زائر بدون اسم';
    }

    function getTodayQuizRecord() {
      const today = getTodayISO();
      if (!appState.quizProgress[today]) appState.quizProgress[today] = {};
      const memberKey = getCurrentQuizMemberKey();
      if (!appState.quizProgress[today][memberKey]) {
        appState.quizProgress[today][memberKey] = {
          answers: {},
          bonusAwarded: false,
          submittedToLeader: false,
          submittedPoints: 0,
        };
      }
      return appState.quizProgress[today][memberKey];
    }

    function setQuizCategory(cat) {
      quizCategory = cat;
      document.querySelectorAll('.qcat-btn').forEach(btn => {
        const active = btn.dataset.qcat === cat;
        btn.className = active
          ? 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-800 text-white'
          : 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
      });
      currentQuestionIndex = 0;
      renderQuizSection();
    }

    function startOrContinueQuiz100() {
      const today = getTodayISO();
      const allQuestions = generate100DailyQuestions(today);
      const rec = getTodayQuizRecord();
      const firstUnanswered = allQuestions.find(q => !Object.prototype.hasOwnProperty.call(rec.answers, q.number));
      quizCategory = 'all';
      document.querySelectorAll('.qcat-btn').forEach(btn => {
        const active = btn.dataset.qcat === 'all';
        btn.className = active
          ? 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-800 text-white'
          : 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
      });
      currentQuestionIndex = firstUnanswered ? firstUnanswered.number - 1 : 0;
      renderQuizSection();
      document.getElementById('activeQuestionCard').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function toggleQuizViewMode() {
      quizListMode = !quizListMode;
      const btn = document.getElementById('quizViewModeBtn');
      if (btn) {
        btn.textContent = quizListMode ? '🃏 وضع سؤال بسؤال' : '📋 عرض كقائمة';
      }
      renderQuizSection();
    }

    function computeTodayQuizScoreAndPoints(rec, allQuestions) {
      let correctCount = 0;
      let earnedPoints = 0;
      Object.entries(rec.answers || {}).forEach(([qNumStr, chosenIdx]) => {
        const qItem = allQuestions.find(item => item.number === Number(qNumStr));
        if (qItem && Number(chosenIdx) === qItem.correctIndex) {
          correctCount++;
          earnedPoints += Number(appState.pointSettings.pointsPerQuestion || 0);
        }
      });
      if (rec.bonusAwarded) {
        earnedPoints += Number(appState.pointSettings.dailyQuizBonus || 0);
      }
      return {
        answeredCount: Object.keys(rec.answers || {}).length,
        correctCount,
        earnedPoints,
      };
    }

    function submitQuizResultToLeader() {
      const today = getTodayISO();
      const allQuestions = generate100DailyQuestions(today);
      const rec = getTodayQuizRecord();
      const summary = computeTodayQuizScoreAndPoints(rec, allQuestions);

      if (summary.answeredCount === 0) {
        showToast('أجب على سؤال واحد على الأقل قبل تسليم النتيجة للقائد', 'warning');
        return;
      }

      let actorName = appState.currentUser.name;
      if (!actorName && !appState.currentUser.isServantAuthenticated) {
        const typedName = (document.getElementById('memberNameInput').value || '').trim();
        if (typedName) {
          setActiveMemberName(typedName);
          actorName = typedName;
        } else {
          actorName = 'مخدوم سريع';
          ensureMemberExists(actorName);
          appState.currentUser.name = actorName;
        }
      } else if (actorName) {
        ensureMemberExists(actorName);
      }

      const displayActor = appState.currentUser.isServantAuthenticated
        ? `${appState.currentUser.servantName || 'خادم'} (خادم)`
        : actorName;

      // حساب الفرق في النقاط إذا تم التسليم سابقاً لتجنب التكرار المزدوج
      const previousSubmittedPts = Number(rec.submittedPoints || 0);
      const deltaToAdd = summary.earnedPoints - previousSubmittedPts;

      if (deltaToAdd !== 0) {
        const memberObj = appState.members.find(m => m.name === actorName);
        if (memberObj) {
          memberObj.bonusPoints = Number(memberObj.bonusPoints || 0) + deltaToAdd;
        }
      }

      rec.submittedToLeader = true;
      rec.submittedPoints = summary.earnedPoints;

      recordActivity(
        displayActor,
        `سلّم نتيجة الـ 100 سؤال (${summary.correctCount} صحيح من ${summary.answeredCount} مجاب — إجمالي نقاط اليوم: ${summary.earnedPoints}ن)`,
        deltaToAdd
      );

      saveLocalState();
      renderAll();
      showToast(
        `تم تسليم نتيجتك (${summary.correctCount}/${summary.answeredCount} صحيح • ${summary.earnedPoints} نقطة) للخادم وتحديث لوحة الشرف!`,
        'success'
      );
    }

    function jumpToQuestion() {
      const num = parseInt(document.getElementById('jumpQuestionInput').value, 10);
      if (isNaN(num) || num < 1 || num > 100) {
        showToast('أدخل رقماً بين 1 و 100', 'warning');
        return;
      }
      quizCategory = 'all';
      setQuizCategory('all');
      currentQuestionIndex = num - 1;
      renderQuizSection();
    }

    function refreshDailyQuestionsManual() {
      manualDailySalt += 1;
      currentQuestionIndex = 0;
      showToast('تم توليد مجموعة جديدة من 100 سؤال لليوم!', 'success');
      renderQuizSection();
    }

    function answerDailyQuestion(qNumber, chosenOptIndex) {
      const today = getTodayISO();
      const questions = generate100DailyQuestions(today);
      const qObj = questions.find(q => q.number === qNumber);
      if (!qObj) return;

      let actorName = appState.currentUser.name;
      if (!actorName && !appState.currentUser.isServantAuthenticated) {
        const typedName = (document.getElementById('memberNameInput').value || '').trim();
        if (typedName) {
          setActiveMemberName(typedName);
          actorName = typedName;
        } else {
          actorName = 'مخدوم سريع';
          ensureMemberExists(actorName);
          appState.currentUser.name = actorName;
        }
      } else if (actorName) {
        ensureMemberExists(actorName);
      }

      const rec = getTodayQuizRecord();
      if (Object.prototype.hasOwnProperty.call(rec.answers, qNumber)) {
        showToast('لقد أجبت على هذا السؤال بالفعل اليوم', 'info');
        return;
      }

      rec.answers[qNumber] = chosenOptIndex;
      const isCorrect = chosenOptIndex === qObj.correctIndex;
      const ptsEarned = isCorrect ? appState.pointSettings.pointsPerQuestion : 0;

      const displayActor = appState.currentUser.isServantAuthenticated
        ? `${appState.currentUser.servantName || 'خادم'} (خادم)`
        : actorName;

      recordActivity(
        displayActor,
        `أجاب على السؤال ${qNumber} من 100 (${isCorrect ? 'صحيح ✅' : 'خطأ ❌'})`,
        ptsEarned
      );

      const totalAnswered = Object.keys(rec.answers).length;
      if (totalAnswered === 100 && !rec.bonusAwarded) {
        rec.bonusAwarded = true;
        recordActivity(displayActor, 'أتم جميع الـ 100 سؤال اليومي وحصل على مكافأة اليوم!', appState.pointSettings.dailyQuizBonus);
        showToast(`مبروك! أتممت 100 سؤال وحصلت على مكافأة ${appState.pointSettings.dailyQuizBonus} نقطة!`, 'success');
      } else if (isCorrect) {
        showToast(`إجابة صحيحة! +${ptsEarned} نقطة`, 'success');
      } else {
        showToast('إجابة غير صحيحة — راجع الشرح بالأسفل', 'warning');
      }

      saveLocalState();
      renderAll();
    }

    function renderQuizSection() {
      const today = getTodayISO();
      const allQuestions = generate100DailyQuestions(today);
      const filteredQuestions = quizCategory === 'all'
        ? allQuestions
        : allQuestions.filter(q => q.category === quizCategory);

      if (currentQuestionIndex >= filteredQuestions.length) {
        currentQuestionIndex = 0;
      }

      const rec = getTodayQuizRecord();
      const scoreSummary = computeTodayQuizScoreAndPoints(rec, allQuestions);
      const answeredCount = scoreSummary.answeredCount;

      document.getElementById('quizDateBadge').textContent = `تاريخ اليوم: ${today}`;
      document.getElementById('quizAnsweredCount').textContent = `${answeredCount} من 100`;
      document.getElementById('quizEarnedToday').textContent = scoreSummary.earnedPoints;
      document.getElementById('quizPointsPerQDisplay').textContent = appState.pointSettings.pointsPerQuestion;
      document.getElementById('quizProgressPercent').textContent = `${answeredCount}%`;
      document.getElementById('quizProgressBar').style.width = `${answeredCount}%`;

      const currentQ = filteredQuestions[currentQuestionIndex] || allQuestions[0];
      const counterBadge = document.getElementById('quizCounterHeaderBadge');
      if (counterBadge && currentQ) {
        counterBadge.textContent = `${currentQ.number} من 100`;
      }

      // رسم خريطة الأرقام 1-100
      const grid = document.getElementById('questionNumberGrid');
      grid.innerHTML = allQuestions.map(q => {
        const hasAns = Object.prototype.hasOwnProperty.call(rec.answers, q.number);
        const isRight = hasAns && Number(rec.answers[q.number]) === q.correctIndex;
        const isCurrent = !quizListMode && currentQ && currentQ.number === q.number;

        let btnClass = 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200';
        if (isCurrent) {
          btnClass = 'bg-blue-800 text-white ring-2 ring-amber-400';
        } else if (hasAns && isRight) {
          btnClass = 'bg-emerald-600 text-white';
        } else if (hasAns && !isRight) {
          btnClass = 'bg-rose-600 text-white';
        }

        return `
          <button onclick="selectQuestionByNumber(${q.number})" class="h-7 rounded-lg text-[11px] font-extrabold transition ${btnClass}">
            ${q.number}
          </button>
        `;
      }).join('');

      const card = document.getElementById('activeQuestionCard');
      const listContainer = document.getElementById('quizListViewContainer');

      if (quizListMode) {
        card.classList.add('hidden');
        listContainer.classList.remove('hidden');
        listContainer.innerHTML = filteredQuestions.map(qItem => {
          const uChoice = Object.prototype.hasOwnProperty.call(rec.answers, qItem.number)
            ? Number(rec.answers[qItem.number])
            : null;
          return `
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 sm:p-5 shadow-card border border-slate-200/70 dark:border-slate-800 space-y-3">
              <div class="flex items-center justify-between gap-2 text-xs">
                <span class="font-extrabold text-blue-900 dark:text-blue-300">${qItem.number} من 100 • ${escapeHTML(qItem.category)}</span>
                <span class="font-bold text-slate-400">${uChoice === null ? 'لم يُجاب' : (uChoice === qItem.correctIndex ? 'صحيح ✅' : 'خطأ ❌')}</span>
              </div>
              <p class="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">${escapeHTML(qItem.questionText)}</p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${qItem.options.map((opt, idx) => {
                  let st = 'bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100';
                  if (uChoice !== null) {
                    if (idx === qItem.correctIndex) st = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200';
                    else if (idx === uChoice) st = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-200';
                  }
                  return `
                    <button ${uChoice !== null ? 'disabled' : ''} onclick="answerDailyQuestion(${qItem.number}, ${idx})"
                      class="text-right px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm font-bold transition ${st}">
                      ${escapeHTML(opt)}
                    </button>
                  `;
                }).join('')}
              </div>
              ${uChoice !== null ? `<p class="text-xs text-blue-900 dark:text-blue-200 bg-blue-50/70 dark:bg-blue-950/30 p-2.5 rounded-xl"><strong>توضيح:</strong> ${escapeHTML(qItem.explanation)}</p>` : ''}
            </div>
          `;
        }).join('');
        return;
      }

      card.classList.remove('hidden');
      listContainer.classList.add('hidden');

      if (!currentQ) {
        card.innerHTML = `<div class="text-center py-10 text-slate-400">لا توجد أسئلة في هذا التصنيف حالياً.</div>`;
        return;
      }

      const userChoice = Object.prototype.hasOwnProperty.call(rec.answers, currentQ.number)
        ? Number(rec.answers[currentQ.number])
        : null;

      card.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <span class="px-3 py-1 rounded-full text-xs font-extrabold bg-blue-100 dark:bg-blue-950/60 text-blue-900 dark:text-blue-300">
              ${currentQ.number} من 100
            </span>
            <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 border border-amber-200/70 dark:border-amber-800/40">
              ${escapeHTML(currentQ.category)}
            </span>
          </div>
          <span class="text-xs font-extrabold text-emerald-700 dark:text-emerald-400">
            +${appState.pointSettings.pointsPerQuestion} نقطة للإجابة الصحيحة
          </span>
        </div>

        <h3 class="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white leading-relaxed">
          ${escapeHTML(currentQ.questionText)}
        </h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          ${currentQ.options.map((opt, idx) => {
            let optStyle = 'bg-slate-50 dark:bg-slate-800/80 hover:bg-blue-50/70 dark:hover:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100';
            if (userChoice !== null) {
              if (idx === currentQ.correctIndex) {
                optStyle = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-900 dark:text-emerald-200 ring-1 ring-emerald-500';
              } else if (idx === userChoice) {
                optStyle = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-900 dark:text-rose-200';
              }
            }

            return `
              <button ${userChoice !== null ? 'disabled' : ''} onclick="answerDailyQuestion(${currentQ.number}, ${idx})"
                class="text-right p-4 rounded-2xl border font-bold text-sm transition flex items-center justify-between gap-2 ${optStyle}">
                <span>${escapeHTML(opt)}</span>
                <span class="text-xs font-extrabold opacity-80">
                  ${userChoice !== null && idx === currentQ.correctIndex ? '✅' : (userChoice === idx ? '❌' : '')}
                </span>
              </button>
            `;
          }).join('')}
        </div>

        ${userChoice !== null ? `
          <div class="p-4 rounded-2xl bg-blue-50/80 dark:bg-blue-950/40 border border-blue-200/80 dark:border-blue-800/60 text-xs sm:text-sm text-blue-950 dark:text-blue-200 leading-relaxed">
            <strong>تفسير مختصر:</strong> ${escapeHTML(currentQ.explanation)}
          </div>
        ` : ''}

        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-3">
          <button onclick="prevQuestion()" ${currentQuestionIndex === 0 ? 'disabled' : ''}
            class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 disabled:opacity-40 transition">
            → السؤال السابق
          </button>
          <span class="text-xs font-extrabold text-slate-500">
            ${currentQ.number} من 100
          </span>
          <button onclick="nextQuestion()" ${currentQuestionIndex >= filteredQuestions.length - 1 ? 'disabled' : ''}
            class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-bold bg-blue-800 hover:bg-blue-900 text-white disabled:opacity-40 transition">
            السؤال التالي ←
          </button>
        </div>
      `;
    }

    function selectQuestionByNumber(num) {
      quizCategory = 'all';
      quizListMode = false;
      const modeBtn = document.getElementById('quizViewModeBtn');
      if (modeBtn) modeBtn.textContent = '📋 عرض كقائمة';
      document.querySelectorAll('.qcat-btn').forEach(btn => {
        const active = btn.dataset.qcat === 'all';
        btn.className = active
          ? 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-800 text-white'
          : 'qcat-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300';
      });
      currentQuestionIndex = Math.max(0, Math.min(99, num - 1));
      renderQuizSection();
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuizSection();
      }
    }

    function nextQuestion() {
      const today = getTodayISO();
      const allQuestions = generate100DailyQuestions(today);
      const filteredQuestions = quizCategory === 'all'
        ? allQuestions
        : allQuestions.filter(q => q.category === quizCategory);
      if (currentQuestionIndex < filteredQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuizSection();
      }
    }

    /* =========================================================================
       8. حساب النقاط والترتيب وتحكم القائد/الخادم
       ========================================================================= */
    function calculateMemberPointsBreakdown(member) {
      let attendanceDays = 0;
      let attendancePts = 0;

      Object.values(appState.attendance || {}).forEach(dayMap => {
        const rec = dayMap?.[member.id];
        if (!rec) return;
        if (rec.status === 'present') {
          attendanceDays++;
          attendancePts += appState.pointSettings.pointsPerAttendance;
        } else if (rec.status === 'excused') {
          attendancePts += appState.pointSettings.pointsPerExcused;
        }
      });

      let quizPts = 0;
      let correctAnswersCount = 0;
      Object.entries(appState.quizProgress || {}).forEach(([dateKey, dayUsers]) => {
        const userRec = dayUsers?.[member.name];
        if (!userRec) return;
        const dayQs = generate100DailyQuestions(dateKey);
        Object.entries(userRec.answers || {}).forEach(([qNumStr, chosenIdx]) => {
          const foundQ = dayQs.find(q => q.number === Number(qNumStr));
          if (foundQ && Number(chosenIdx) === foundQ.correctIndex) {
            correctAnswersCount++;
            quizPts += appState.pointSettings.pointsPerQuestion;
          }
        });
        if (userRec.bonusAwarded) {
          quizPts += appState.pointSettings.dailyQuizBonus;
        }
      });

      const manualBonus = Number(member.bonusPoints || 0);
      const totalPoints = attendancePts + quizPts + manualBonus;

      return {
        attendanceDays,
        correctAnswersCount,
        attendancePts,
        quizPts,
        manualBonus,
        totalPoints,
      };
    }

    document.getElementById('githubConfigForm').addEventListener('submit', function (e) {

    function updateCloudStatusUI(mode, label) {
      const dot = document.getElementById('cloudStatusDot');
      const text = document.getElementById('cloudStatusText');
      if (!dot || !text) return;

      text.textContent = label;
      if (mode === 'synced') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
      } else if (mode === 'syncing') {
        dot.className = 'w-2 h-2 rounded-full bg-blue-500 animate-ping';
      } else if (mode === 'error') {
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
      }
    }

    function encodeUTF8ToBase64(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) {
        bin += String.fromCharCode(bytes[i]);
      }
      return btoa(bin);
    }

    function decodeBase64ToUTF8(b64) {
      const bin = atob(b64.replace(/\n/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) {
        bytes[i] = bin.charCodeAt(i);
      }
      return new TextDecoder().decode(bytes);
    }

    async function fetchRemoteGitHubFile() {
      const { owner, repo, branch, path, token } = appState.github;
      const endpoint = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(path)}?ref=${encodeURIComponent(branch || 'main')}`;
      const headers = {
        Accept: 'application/vnd.github+json',
      };
      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      const res = await fetch(endpoint, { headers, cache: 'no-store' });
      if (res.status === 404) {
        return { exists: false, sha: '', data: null };
      }
      if (!res.ok) {
        const errBody = await res.text();
        throw new Error(`GitHub GET ${res.status}: ${errBody.slice(0, 120)}`);
      }
      const json = await res.json();
      const decodedText = decodeBase64ToUTF8(json.content || '');
      return {
        exists: true,
        sha: json.sha || '',
        data: decodedText ? JSON.parse(decodedText) : null,
      };
    }

    async function syncWithGitHub(direction = 'push', silent = false) {
      const { owner, repo, branch, path, token } = appState.github;

      if (!owner || !repo) {
        if (!silent) {
          showToast('سحابة GitHub غير مضبوطة بعد — التطبيق يعمل محلياً بنجاح ولا يحتاج المخدوم لأي رمز', 'info');
        }
        updateCloudStatusUI('local', 'تخزين محلي نشط');
        return;
      }

      updateCloudStatusUI('syncing', 'جاري المزامنة...');

      try {
        if (direction === 'pull' || !token) {
          const remote = await fetchRemoteGitHubFile();
          if (remote.exists && remote.data) {
            appState.github.sha = remote.sha;
            // دمج البيانات السحابية مع الحفاظ على التوكن المحلي الحالي للخادم
            const localToken = appState.github.token;
            const localRole = { ...appState.currentUser };
            appState = {
              ...createDefaultState(),
              ...remote.data,
              currentUser: localRole,
              github: {
                ...createDefaultState().github,
                ...(remote.data.github || {}),
                owner,
                repo,
                branch: branch || 'main',
                path: path || 'church-community-data.json',
                token: localToken,
                sha: remote.sha,
              }
            };
            saveLocalState(false);
            updateCloudStatusUI('synced', 'تم السحب من GitHub');
            if (!silent) showToast('تم سحب أحدث البيانات من سحابة GitHub بنجاح', 'success');
            renderAll();
            return;
          } else if (!token) {
            updateCloudStatusUI('local', 'قراءة عامة بدون توكن');
            if (!silent) showToast('لم يتم العثور على ملف بيانات بعد في المستودع', 'info');
            return;
          }
        }

        // وضع الرفع (push) يتطلب رمز وصول للخادم
        if (!token) {
          updateCloudStatusUI('local', 'أدخل رمز الخادم للرفع');
          if (!silent) showToast('أدخل رمز GitHub في لوحة القائد لرفع التعديلات للسحابة', 'warning');
          return;
        }

        const remoteCheck = await fetchRemoteGitHubFile();
        if (remoteCheck.exists && remoteCheck.sha) {
          appState.github.sha = remoteCheck.sha;
        }

        // إعداد نسخة نظيفة للرفع دون تعريض التوكن داخل ملف البيانات العام
        const payloadToUpload = {
          ...appState,
          github: {
            owner: appState.github.owner,
            repo: appState.github.repo,
            branch: appState.github.branch || 'main',
            path: appState.github.path || 'church-community-data.json',
            autoSync: Boolean(appState.github.autoSync),
            token: '',
            sha: '',
          }
        };

        const endpoint = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${encodeURIComponent(path || 'church-community-data.json')}`;
        const body = {
          message: `تحديث بيانات الخدمة والكنيسة (${getTodayISO()} ${formatTimeNow()})`,
          content: encodeUTF8ToBase64(JSON.stringify(payloadToUpload, null, 2)),
          branch: branch || 'main',
        };
        if (appState.github.sha) {
          body.sha = appState.github.sha;
        }

        const putRes = await fetch(endpoint, {
          method: 'PUT',
          headers: {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(body),
        });

        if (!putRes.ok) {
          const errText = await putRes.text();
          throw new Error(`GitHub PUT ${putRes.status}: ${errText.slice(0, 120)}`);
        }

        const putJson = await putRes.json();
        if (putJson.content && putJson.content.sha) {
          appState.github.sha = putJson.content.sha;
          saveLocalState(false);
        }

        updateCloudStatusUI('synced', 'متزامن مع GitHub');
        if (!silent) showToast('تمت مزامنة البيانات مع سحابة GitHub بنجاح!', 'success');
      } catch (err) {
        console.error('فشل مزامنة GitHub:', err);
        updateCloudStatusUI('error', 'خطأ في المزامنة');
        if (!silent) showToast(`تعذر المزامنة: ${err.message}`, 'error');
      }
    }
